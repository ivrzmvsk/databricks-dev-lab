resources:
  jobs:
    promotion_job:
      name: lab8-wikipedia-promotion-${bundle.target}
      description: Idempotent setup, triggered live Wikipedia ingestion, Gold, governance and release
        gate
      permissions: ${var.manage_permissions}
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true
      parameters: ${var.wikipedia_job_parameters}
      tasks:
      - task_key: setup
        max_retries: 0
        timeout_seconds: 2400
        notebook_task:
          notebook_path: ../notebooks/setup.py
      - task_key: ingestion
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: setup
        pipeline_task:
          pipeline_id: ${resources.pipelines.wiki_pipeline.id}
          full_refresh: false
      - task_key: reference
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: ingestion
        notebook_task:
          notebook_path: ../notebooks/reference.py
      - task_key: gold
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: reference
        notebook_task:
          notebook_path: ../notebooks/gold.py
      - task_key: governance
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: gold
        notebook_task:
          notebook_path: ../notebooks/governance.py
      - task_key: validation
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: governance
        notebook_task:
          notebook_path: ../notebooks/validation.py
      - task_key: volume
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: validation
        notebook_task:
          notebook_path: ../notebooks/volume.py
      - task_key: release_gate
        max_retries: 0
        timeout_seconds: 2400
        depends_on:
        - task_key: volume
        notebook_task:
          notebook_path: ../notebooks/release_gate.py
