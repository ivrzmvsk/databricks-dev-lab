bundle:
  name: lab10_wikipedia_federation_cdc
  databricks_cli_version: '>= 1.10.0'

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  schema:
    default: ivanrazumovskyi_lab10
  foreign_catalog:
    default: ivanrazumovskyi_lab10_neon_dev
  gold_schema:
    default: dev_ivanrazumovskyi_ivanrazumovskyi_lab9_gold

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  include:
    - src/**
    - notebooks/**
  exclude:
    - .env*
    - .venv/**
    - tools/**
    - tests/**

targets:
  personal:
    default: true
    mode: development
    workspace:
      host: https://dbc-ab9a5afe-c151.cloud.databricks.com
      profile: personal-env
    presets:
      name_prefix: ''
      jobs_max_concurrent_runs: 1

  # Promotion authorized after complete DEV validation.
  azure_trial_2:
    mode: production
    run_as:
      user_name: ivanrazumovskyi@softserve.academy
    permissions:
      - user_name: ivanrazumovskyi@softserve.academy
        level: CAN_MANAGE
    workspace:
      host: https://adb-7405618361895520.0.azuredatabricks.net
      profile: azure_trial_2
      root_path: /Workspace/Users/ivanrazumovskyi@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      foreign_catalog: ivanrazumovskyi_lab10_neon_prod
      gold_schema: ivanrazumovskyi_lab9_gold
