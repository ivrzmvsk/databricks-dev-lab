bundle:
  name: lab7_wikipedia_quality

include:
  - resources/*.yml

variables:
  catalog:
    default: workspace
  schema:
    default: ivanrazumovskyi_lab7
  bronze_schema:
    default: ivanrazumovskyi_lab5
  gold_schema:
    default: ivanrazumovskyi_lab6
  azure_node_type:
    default: Standard_D4ds_v5
  azure_spark_version:
    default: 17.3.x-scala2.13

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  paths:
    - .
    - ../lab5/src
    - ../lab6/src

targets:
  personal:
    default: true
    mode: development
    workspace:
      profile: personal-env
    resources:
      jobs:
        lab7_quality_job:
          tasks:
            - task_key: unit_tests
              environment_key: tests
            - task_key: constraints_and_gate
              environment_key: tests
  azure_dev:
    mode: development
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    variables:
      catalog: dbr_dev
    presets:
      trigger_pause_status: PAUSED
    resources:
      pipelines:
        lab7_fail_demo:
          serverless: false
          clusters:
            - label: default
              node_type_id: ${var.azure_node_type}
              num_workers: 1
        lab7_quality_pipeline:
          serverless: false
          clusters:
            - label: default
              node_type_id: ${var.azure_node_type}
              num_workers: 1
      jobs:
        lab7_quality_job:
          job_clusters:
            - job_cluster_key: classic
              new_cluster:
                spark_version: ${var.azure_spark_version}
                node_type_id: ${var.azure_node_type}
                num_workers: 1
                data_security_mode: USER_ISOLATION
          tasks:
            - task_key: snapshot
              job_cluster_key: classic
            - task_key: unit_tests
              job_cluster_key: classic
              libraries:
                - pypi:
                    package: pytest==8.3.5
                - pypi:
                    package: databricks-labs-dqx==0.16.0
            - task_key: constraints_and_gate
              job_cluster_key: classic
              libraries:
                - pypi:
                    package: databricks-labs-dqx==0.16.0
        lab7_setup_job:
          job_clusters:
            - job_cluster_key: classic
              new_cluster:
                spark_version: ${var.azure_spark_version}
                node_type_id: ${var.azure_node_type}
                num_workers: 1
                data_security_mode: USER_ISOLATION
          tasks:
            - task_key: setup
              job_cluster_key: classic
