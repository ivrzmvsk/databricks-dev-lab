bundle:
  name: lab5_netflix_wikipedia

include:
  - resources/*.yml

variables:
  catalog:
    description: Existing Unity Catalog catalog
    default: dbr_dev
  schema:
    description: Isolated output schema for Lab 5
    default: ivanrazumovskyi_lab5
  source_csv_path:
    description: Exact path to the Netflix CSV in a UC volume
    default: /Volumes/${var.catalog}/${var.schema}/lab5_sources/netflix/netflix_titles.csv
  eventhub_namespace:
    default: evhpl24databricks02
  eventhub_name:
    default: ivanrazumovskyi_evh
  secret_scope:
    default: ivanrazumovskyi-kv-scope2
  secret_key:
    default: eventhub-connection-string
  azure_node_type:
    description: Node type permitted by the Azure workspace/policy
    default: Standard_D4ds_v5
  quality_demo:
    description: Add isolated synthetic Wikipedia fixtures to demonstrate dropped metrics
    default: "false"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  exclude:
    - producer/.env
    - screenshots/**
    - tests/**

targets:
  azure_dev:
    mode: development
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    resources:
      pipelines:
        lab5_pipeline:
          serverless: false
          clusters:
            - label: default
              node_type_id: ${var.azure_node_type}
              num_workers: 1
  personal:
    mode: development
    workspace:
      profile: personal-env
    variables:
      catalog: workspace
      secret_scope: lab5-eventhub
    resources:
      pipelines:
        lab5_pipeline:
          serverless: true
  azure_trial:
    mode: development
    workspace:
      profile: azure-trial
    variables:
      catalog: dbr_dev_trial
      secret_scope: lab5-eventhub
    resources:
      pipelines:
        lab5_pipeline:
          serverless: true
  azure_trial_2:
    mode: development
    workspace:
      profile: azure_trial_2
    variables:
      catalog: dbr_dev
      secret_scope: lab5-eventhub
    resources:
      pipelines:
        lab5_pipeline:
          serverless: true
