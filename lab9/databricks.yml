bundle:
  name: lab9_wikipedia_automation
  databricks_cli_version: '>= 1.10.0, <= 1.10.0'
  engine: direct

include:
  - resources/*.yml
  - ../lab8/config/*.yml

variables:
  reader_principal:
    default: ${workspace.current_user.userName}
  catalog:
    default: workspace
  silver_schema:
    default: ivanrazumovskyi_lab9_silver
  gold_schema:
    default: ivanrazumovskyi_lab9_gold
  eventhub_namespace:
    default: evhpl24databricks02
  eventhub_name:
    default: ivanrazumovskyi_evh
  secret_scope:
    default: lab5-eventhub
  secret_key:
    default: eventhub-connection-string

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  paths:
    - .
    - ../lab5/src
    - ../lab6/src
    - ../lab8/notebooks
    - ../lab8/src
    - ../lab8/pipeline
    - ../lab8/sql/migrations
    - ../lab8/assets

targets:
  personal:
    mode: development
    workspace:
      host: https://dbc-ab9a5afe-c151.cloud.databricks.com
      profile: personal-env
    presets:
      name_prefix: ''
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
    resources:
      pipelines:
        wiki_pipeline:
          development: true

  # Azure execution requires explicit --target azure_trial_2; CI uses it as PROD.
  azure_trial_2:
    mode: production
    workspace:
      host: https://adb-7405618361895520.0.azuredatabricks.net
      profile: azure_trial_2
      root_path: /Workspace/Users/ivanrazumovskyi@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
    variables:
      catalog: dbr_dev
      secret_scope: lab5-eventhub
    resources:
      pipelines:
        wiki_pipeline:
          development: false
          serverless: true
