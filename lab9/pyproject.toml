[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab9-wikipedia-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["databricks-sdk==0.146.0"]

[project.scripts]
lab9 = "lab9.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Record all execution failures; cleanup must preserve the original error.
"src/lab9/automation.py" = ["BLE001"]
