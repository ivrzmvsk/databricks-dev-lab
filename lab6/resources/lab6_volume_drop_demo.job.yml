resources:
  jobs:
    lab6_volume_drop_demo:
      name: lab6-wikimedia-volume-drop-demo
      description: Remove about 90 percent of Lab 6 fact rows, evaluate alert, then rebuild and recover.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: source_schema
          default: ${var.source_schema}
        - name: source_code_path
          default: ${workspace.file_path}/src
      tasks:
        - task_key: simulate_drop
          notebook_task:
            notebook_path: ../notebooks/lab6_07_simulate_drop.py
        - task_key: evaluate_drop
          depends_on:
            - task_key: measure_drop
          alert_task:
            alert_id: ${resources.alerts.lab6_volume_alert.id}
        - task_key: measure_drop
          depends_on:
            - task_key: simulate_drop
          notebook_task:
            notebook_path: ../notebooks/lab6_05_volume.py
            base_parameters:
              scenario: simulated_drop
        - task_key: restore_gold
          depends_on:
            - task_key: evaluate_drop
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../notebooks/lab6_02_build_gold.py
        - task_key: validate_recovery
          depends_on:
            - task_key: restore_gold
          notebook_task:
            notebook_path: ../notebooks/lab6_04_validate.py
        - task_key: record_recovery
          depends_on:
            - task_key: validate_recovery
          notebook_task:
            notebook_path: ../notebooks/lab6_05_volume.py
            base_parameters:
              scenario: recovered
        - task_key: evaluate_recovery
          depends_on:
            - task_key: record_recovery
          alert_task:
            alert_id: ${resources.alerts.lab6_volume_alert.id}
