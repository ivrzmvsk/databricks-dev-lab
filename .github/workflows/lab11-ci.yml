name: Lab 11 CI

on:
  push:
    paths:
      - 'lab11/**'
      - '.github/workflows/lab11-ci.yml'
  pull_request:
    paths:
      - 'lab11/**'
      - '.github/workflows/lab11-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab11/requirements-dev.txt
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r lab11/requirements-dev.txt
          python -m pip install --no-deps -e lab11
      - name: Lint and format
        run: |
          python -m ruff check lab11
          python -m ruff format --check lab11
      - name: Offline tests including real SQL MERGE
        run: python -m pytest -c lab11/pyproject.toml lab11/tests
