name: Lab 8 CI and promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'lab8/**'
      - 'lab5/src/**'
      - 'lab6/src/**'
      - '.github/workflows/lab8-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lab8/**'
      - 'lab5/src/**'
      - 'lab6/src/**'
      - '.github/workflows/lab8-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Wikipedia tests and static configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab8/requirements-ci.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r lab8/requirements-ci.txt
      - uses: databricks/setup-cli@main
        with:
          version: '1.10.0'
      - run: python lab8/tools/check_bundle.py
      - run: python -m pytest -c lab8/pytest.ini lab8/tests --junitxml=lab8-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab8-tests
          path: lab8-tests.xml

  validate-dev:
    name: Validate bundle in personal DEV
    needs: tests
    # Credentials are used only for trusted code. Fork PRs still run local tests.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: '1.10.0'
      - name: Configure personal DEV profile (host only)
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          if not os.environ.get('DATABRICKS_TOKEN'):
              raise SystemExit('Configure DATABRICKS_DEV_TOKEN in GitHub Secrets')
          config = Path(os.environ['RUNNER_TEMP']) / 'lab8-databrickscfg'
          config.write_text(
              '[personal-env]\nhost = https://dbc-ab9a5afe-c151.cloud.databricks.com\n'
          )
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'DATABRICKS_CONFIG_FILE={config}\n')
          PY
      - name: Validate DEV bundle
        working-directory: lab8
        run: databricks bundle validate --strict -t dev --profile personal-env

  deploy-prod:
    name: Deploy and verify PROD job
    needs: [tests, validate-dev]
    # The owner alone enables this variable after reviewing and configuring PROD.
    # Default: skipped. No Azure credentials are consumed by PR jobs.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.LAB8_ENABLE_PROD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: lab8-prod
    concurrency:
      group: lab8-prod-deployment
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: ${{ vars.LAB8_PROD_AUTH_TYPE || 'oauth-m2m' }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_PROD_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_PROD_CLIENT_SECRET }}
      BUNDLE_VAR_run_as: ${{ vars.LAB8_PROD_RUN_AS }}
      BUNDLE_VAR_manage_permissions: ${{ vars.LAB8_PROD_MANAGE_PERMISSIONS }}
      BUNDLE_VAR_reader_principal: ${{ vars.LAB8_PROD_READER }}
      BUNDLE_VAR_warehouse_id: ${{ vars.LAB8_PROD_WAREHOUSE_ID }}
    defaults:
      run:
        working-directory: lab8
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
        with:
          version: '1.10.0'
      - name: Install bundle configuration reader
        run: python -m pip install PyYAML==6.0.3
      - name: Verify owner-supplied PROD settings
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path
          import yaml
          required = ['DATABRICKS_HOST', 'BUNDLE_VAR_run_as',
                      'BUNDLE_VAR_manage_permissions', 'BUNDLE_VAR_reader_principal', 'BUNDLE_VAR_warehouse_id']
          auth = os.environ['DATABRICKS_AUTH_TYPE']
          if auth == 'oauth-m2m':
              required += ['DATABRICKS_CLIENT_ID', 'DATABRICKS_CLIENT_SECRET']
          elif auth == 'pat':
              required += ['DATABRICKS_TOKEN']
          else:
              raise SystemExit('Use oauth-m2m (recommended) or pat')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing GitHub settings: ' + ', '.join(missing))
          bundle = yaml.safe_load(Path('databricks.yml').read_text())
          expected = bundle['targets']['prod']['workspace']['host'].rstrip('/')
          if os.environ['DATABRICKS_HOST'].rstrip('/') != expected:
              raise SystemExit('PROD host does not match the intended Azure workspace')
          run_as = json.loads(os.environ['BUNDLE_VAR_run_as'])
          if auth == 'oauth-m2m' and run_as != {'service_principal_name': os.environ['DATABRICKS_CLIENT_ID']}:
              raise SystemExit('Deploy and run as the same service principal for this bundle')
          acl = json.loads(os.environ['BUNDLE_VAR_manage_permissions'])
          if not isinstance(acl, list) or not acl:
              raise SystemExit('PROD manage permissions must be a nonempty JSON list')
          PY
      - run: databricks bundle validate --strict -t prod
      - run: databricks bundle deploy -t prod --auto-approve
      - name: Save deployment inventory
        run: databricks bundle summary -t prod --output json > prod-summary.json
      # Blocking: bundle run waits for terminal success and exits nonzero on failure.
      # No --no-wait, schedule, continuous mode or full refresh.
      - name: Run the deployed Wikipedia job and wait for its release gate
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: databricks bundle run promotion_job -t prod --params "release_commit=$RELEASE_COMMIT" 2>&1 | tee prod-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab8-prod-deployment
          path: |
            lab8/prod-summary.json
            lab8/prod-run.log
