name: Lab 7 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wikipedia-tests:
    name: Wikipedia tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab7/requirements-ci.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: python -m pip install -r lab7/requirements-ci.txt
      - name: Run Wikipedia unit and fixture quality tests
        run: python -m pytest -c lab7/pytest.ini lab7/tests
