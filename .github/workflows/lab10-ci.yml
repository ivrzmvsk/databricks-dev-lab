name: Lab 10 CI

on:
  push:
    paths:
      - 'lab10/**'
      - '.github/workflows/lab10-ci.yml'
  pull_request:
    paths:
      - 'lab10/**'
      - '.github/workflows/lab10-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: lab10/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r lab10/requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check lab10
          python -m ruff format --check lab10
      - name: Test boundaries and seed contract
        run: python -m pytest -c lab10/pyproject.toml lab10/tests
