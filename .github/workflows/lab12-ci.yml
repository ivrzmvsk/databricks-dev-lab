name: Lab 12 Board-Game RAG

on:
  pull_request:
    branches: [main]
    paths: ['lab12/**', '.github/workflows/lab12-ci.yml']
  push:
    branches: [main]
    paths: ['lab12/**', '.github/workflows/lab12-ci.yml']
  workflow_dispatch:
    inputs:
      run_dev:
        description: Deploy and run the full RAG evaluation in personal DEV
        type: boolean
        default: false
      promote_prod:
        description: Promote committed DEV evidence and manual review for this exact build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lab12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab12/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests tools notebooks
      - run: python -m ruff format --check src tests tools notebooks
      - run: python -m pytest -q --junitxml=lab12-tests.xml
      - run: python tools/check_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab12-tests
          path: lab12/lab12-tests.xml

  validate-dev:
    needs: tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
    defaults:
      run:
        working-directory: lab12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -e .
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7
        with:
          version: '1.10.0'
      - run: python tools/configure_dev_ci.py
      - run: databricks bundle validate --strict -t dev --profile personal-env --var warehouse_id=6fec7d20a958edd1

  run-dev:
    needs: [tests, validate-dev]
    if: github.event_name == 'workflow_dispatch' && inputs.run_dev && !inputs.promote_prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lab12-personal-dev
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
    defaults:
      run:
        working-directory: lab12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7
        with:
          version: '1.10.0'
      - run: python tools/configure_dev_ci.py
      - run: databricks bundle deploy -t dev --profile personal-env --var warehouse_id=6fec7d20a958edd1
      - name: Prepare DEV infrastructure outside the data Job
        run: python tools/setup_resources.py --target dev --profile personal-env --warehouse-id 6fec7d20a958edd1
      - run: databricks bundle run steam_rag -t dev --profile personal-env --var warehouse_id=6fec7d20a958edd1

  deploy-prod:
    needs: [tests, validate-dev]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.promote_prod &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: lab12-prod
    concurrency:
      group: lab12-azure-prod
      cancel-in-progress: false
    env:
      DATABRICKS_AUTH_TYPE: pat
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      LAB12_PROD_WAREHOUSE_ID: ${{ vars.LAB12_PROD_WAREHOUSE_ID }}
    defaults:
      run:
        working-directory: lab12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python tools/check_release.py
      - name: Verify PROD destination and configure host-only profile
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from lab12.config import PROD_HOST
          if os.environ.get('DATABRICKS_HOST', '').rstrip('/') != PROD_HOST:
              raise SystemExit('PROD host mismatch')
          if not os.environ.get('DATABRICKS_TOKEN') or not os.environ.get('LAB12_PROD_WAREHOUSE_ID'):
              raise SystemExit('PROD credentials and warehouse are required')
          path = Path(os.environ['RUNNER_TEMP']) / 'lab12-prod-databrickscfg'
          path.write_text(f'[azure_trial_2]\nhost = {PROD_HOST}\n')
          path.chmod(0o600)
          with Path(os.environ['GITHUB_ENV']).open('a') as handle:
              handle.write(f'DATABRICKS_CONFIG_FILE={path}\n')
          PY
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7
        with:
          version: '1.10.0'
      - run: databricks bundle validate --strict -t prod --profile azure_trial_2 --var "warehouse_id=$LAB12_PROD_WAREHOUSE_ID"
      - run: databricks bundle deploy -t prod --profile azure_trial_2 --var "warehouse_id=$LAB12_PROD_WAREHOUSE_ID"
      - name: Prepare PROD infrastructure outside the data Job
        run: python tools/setup_resources.py --target prod --profile azure_trial_2 --warehouse-id "$LAB12_PROD_WAREHOUSE_ID"
      - run: databricks bundle run steam_rag -t prod --profile azure_trial_2 --var "warehouse_id=$LAB12_PROD_WAREHOUSE_ID"
