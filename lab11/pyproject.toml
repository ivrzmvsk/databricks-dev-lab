[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-lab11"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk==0.152.0",
  "databricks-zerobus-ingest-sdk==1.10.0",
  "python-dotenv==1.2.4",
  "requests==2.34.2",
  "requests-sse==0.5.3",
  "sqlparse>=0.5.3,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "duckdb>=1.4,<2", "ruff>=0.14,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab11 = ["sql/*.sql", "targets.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "E402"]
